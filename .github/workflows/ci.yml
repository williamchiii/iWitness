name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Only used to satisfy config.py's fail-fast check during the
      # smoke-test import below; never a real secret.
      PLAYBACK_SIGNING_SECRET: ci-smoke-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python -c "import main"
      # A glob rather than `unittest discover`: tests/ has no __init__.py, so
      # discovery cannot import it as a start directory.
      - run: python -m unittest tests/test_*.py
